<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new5W1H</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>新しい5W1Hゲーム</h1>

        <!-- お題 -->
        <section class="game">
            <div id="question" class="question">
                ----
            </div>
            <button id="nextButton" class="main-button">
                次のお題
            </button>
        </section>

        <!-- 回答 -->
        <section class="answer-section">
            <h2>回答</h2>
            <div id="answerArea">
            </div>
            <button id="submitButton" class="answer-button">
                回答
            </button>
        </section>

        <!-- 履歴 -->
        <section class="history">
            <h2>回答履歴</h2>
            <div id="historyList">
                <p class="empty">まだ回答がありません。</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
